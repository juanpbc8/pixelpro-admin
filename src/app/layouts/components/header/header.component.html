<div class="header-content">
  <div class="header-left">
    <h5 class="page-title mb-0">Panel de Administración</h5>
  </div>

  <div class="header-right">
    @if (currentUser(); as user) {
    <div class="dropdown">
      <button class="btn btn-link dropdown-toggle text-decoration-none d-flex align-items-center" type="button"
        id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-info">
          <span class="user-name">{{ user.email }}</span>
          <small class="user-role">{{ user.rol }}</small>
        </div>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
        <li class="dropdown-header">
          <div class="text-center">
            <strong>{{ user.email }}</strong>
            <div class="text-muted small">{{ user.rol }}</div>
          </div>
        </li>
        <li>
          <hr class="dropdown-divider">
        </li>
        <li><a class="dropdown-item" [routerLink]="['/users', user.id]"><i class="bi bi-person me-2"></i>Perfil</a></li>
        <li><a class="dropdown-item" [routerLink]="['/users', user.id, 'edit']"><i
              class="bi bi-gear me-2"></i>Configuración</a></li>
        <li>
          <hr class="dropdown-divider">
        </li>
        <li><button class="dropdown-item text-danger" (click)="onLogout()"><i
              class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</button></li>
      </ul>
    </div>
    }
  </div>
</div>
